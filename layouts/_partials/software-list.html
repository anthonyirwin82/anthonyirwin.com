<p>This is a collection of software, scripts and websites that I have developed.</p>

<div class="container text-center mb-4">
  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
    {{ range site.Data.software }}
      <div class="col d-flex justify-content-center">
        <div class="card h-100 d-flex flex-column" style="width: 340px;">
          <img src="{{ .cardImg }}" class="card-img-top" alt="{{ .cardTitle }}">

          <div class="card-body d-flex flex-column bg-dark">
            <h5 class="card-title text-white">{{ .cardTitle }}</h5>
            <p class="card-text text-white">{{ .cardText }}</p>

            <div class="mt-auto">
              {{ with .websiteUrl }}
                <a href="{{ . }}" class="btn btn-success me-2" target="_blank">Website</a>
              {{ end }}
              {{ with .githubUrl }}
                <a href="{{ . }}" class="btn btn-primary" target="_blank">GitHub</a>
              {{ end }}
            </div>
          </div>
        </div>
      </div>
    {{ end }}
  </div>
</div>
