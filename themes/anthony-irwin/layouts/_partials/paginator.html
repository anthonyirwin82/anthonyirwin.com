{{ if gt .TotalPages 1 }}
  <nav aria-label="Page navigation" class="mt-4">
    <ul class="pagination justify-content-center">
      {{ if .HasPrev }}
        <li class="page-item"><a class="page-link" href="{{ .Prev.URL }}">Previous</a></li>
      {{ end }}
      {{ range .Pagers }}
        <li class="page-item {{ if eq .PageNumber $.PageNumber }}active{{ end }}"><a class="page-link" href="{{ .URL }}">{{ .PageNumber }}</a></li>
      {{ end }}
      {{ if .HasNext }}
        <li class="page-item"><a class="page-link" href="{{ .Next.URL }}">Next</a></li>
      {{ end }}
    </ul>
  </nav>
{{ end }}
