{{ define "main" }}
{{ with .Params.BannerId }}
  <div id="{{ . }}" class="container-fluid screen banner banner-height">
{{ else }}
  <div id="zoom-session" class="container-fluid screen banner banner-height">
{{ end }}
      <div class="d-flex justify-content-center align-items-center my-auto banner-height">
          <h1 class="text-center">{{ .Title }} Tags</h1>
      </div>
  </div>
  <article class="container">
    {{ .Content }}
    {{ range .Pages }}
          <li class="list-group-item">
            <h2><a href="{{ .RelPermalink }}"><strong>{{ .LinkTitle }}</strong></a></h2>
            {{ with .Params.Description }}
              <p class="mb-0 text-muted">{{ . }}</p>
            {{ else }}
              <p class="mb-0 text-muted">{{ .Summary }}</p>
            {{ end }}
          </li>
    {{ end }}
  </article>
{{ end }}
